; pioarduino = Arduino-ESP32 core 3.x, which EspUsbHost needs
[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
;build_flags = -DHID_RAW_DEBUG
build_flags = -DPAD_FILTER_DOWN_DIAGONALS   ; Tetris-style games; remove to disable
lib_deps = tanakamasayuki/EspUsbHost
